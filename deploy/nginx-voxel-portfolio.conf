# nginx — serve the contents of build/ at the domain root over HTTPS.
# (Pointer Lock needs a secure context; get a cert via certbot / your panel.)
server {
    listen 443 ssl;
    server_name example.com;
    root /var/www/voxel-portfolio;   # <-- contents of build/ go here
    index index.html;

    # SPA fallback — but real files (models, chunks) win first via try_files $uri
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-hashed assets: cache hard
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # GLBs: must serve the file itself, never the fallback (see DEPLOY.md)
    location /models/ {
        types { model/gltf-binary glb; }
        default_type model/gltf-binary;
        expires 7d;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # .glb files are already Meshopt-compressed — don't gzip them again.
}
